<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <defs>
    <radialGradient id="bg" cx="14%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020817" stop-opacity="0"/>
    </radialGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="420" height="120" rx="12" fill="#020817"/>
  <rect width="420" height="120" rx="12" fill="url(#bg)"/>
  <rect width="420" height="120" rx="12" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Icon mark (left) -->
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="44" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.2" stroke-dasharray="3 5"/>
  <!-- Middle ring -->
  <circle cx="60" cy="60" r="34" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35"/>
  <!-- Orbit dots -->
  <circle cx="60" cy="26" r="3" fill="#38bdf8" filter="url(#g)" opacity="0.85"/>
  <circle cx="89.4" cy="77" r="2" fill="#22d3ee" filter="url(#g)" opacity="0.6"/>
  <!-- Hex -->
  <polygon points="60,38 81,49.5 81,72.5 60,84 39,72.5 39,49.5"
    stroke="#38bdf8" stroke-width="1.25" stroke-opacity="0.55" fill="none" filter="url(#g)"/>
  <!-- Relay arrows -->
  <line x1="43" y1="60" x2="51" y2="60" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.65"/>
  <polygon points="51,57 57,60 51,63" fill="#22d3ee" opacity="0.65"/>
  <line x1="69" y1="60" x2="77" y2="60" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.65"/>
  <polygon points="77,57 83,60 77,63" fill="#22d3ee" opacity="0.65"/>
  <!-- Core -->
  <circle cx="60" cy="60" r="13" fill="#020817" stroke="#38bdf8" stroke-width="1.25" filter="url(#g)"/>
  <text x="60" y="64.5" text-anchor="middle" font-family="monospace" font-weight="700"
    font-size="9" fill="#38bdf8" filter="url(#g)" letter-spacing="0.5">RC</text>

  <!-- Wordmark -->
  <!-- "Relay" -->
  <text x="122" y="67" font-family="monospace" font-weight="700" font-size="32"
    fill="#38bdf8" filter="url(#g)" letter-spacing="-0.5">Relay</text>
  <!-- "Core" -->
  <text x="249" y="67" font-family="monospace" font-weight="700" font-size="32"
    fill="#e2e8f0" letter-spacing="-0.5">Core</text>

  <!-- Tagline -->
  <text x="122" y="86" font-family="monospace" font-size="9.5" fill="#38bdf8"
    fill-opacity="0.45" letter-spacing="2.5">EVENT RELAY CONTROL PANEL</text>

  <!-- Divider line between icon and text -->
  <line x1="108" y1="24" x2="108" y2="96" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.15"/>
</svg>
