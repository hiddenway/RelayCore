<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle glow -->
  <circle cx="100" cy="100" r="90" fill="url(#core)"/>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 6"/>

  <!-- Middle ring -->
  <circle cx="100" cy="100" r="68" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Orbit dot on middle ring -->
  <circle cx="100" cy="32" r="3.5" fill="#38bdf8" filter="url(#glow)" opacity="0.9"/>
  <circle cx="163.8" cy="134" r="2.5" fill="#22d3ee" filter="url(#glow)" opacity="0.7"/>
  <circle cx="36.2" cy="134" r="2" fill="#38bdf8" filter="url(#glow)" opacity="0.5"/>

  <!-- Inner ring dashed -->
  <circle cx="100" cy="100" r="50" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.2" stroke-dasharray="2 5"/>

  <!-- Hexagon frame -->
  <polygon
    points="100,54 138.1,77 138.1,123 100,146 61.9,123 61.9,77"
    stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" fill="none"
    filter="url(#glow)"
  />

  <!-- Corner ticks on hex -->
  <line x1="100" y1="48" x2="100" y2="54" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="143" y1="73" x2="138.1" y2="77" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="143" y1="127" x2="138.1" y2="123" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="100" y1="152" x2="100" y2="146" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="57" y1="127" x2="61.9" y2="123" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="57" y1="73" x2="61.9" y2="77" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Signal relay arrows -->
  <!-- Left arrow -->
  <path d="M72 100 L84 100" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arrow)"/>
  <!-- Right arrow -->
  <path d="M116 100 L128 100" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#22d3ee" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Core circle -->
  <circle cx="100" cy="100" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-strong)"/>
  <circle cx="100" cy="100" r="14" fill="#38bdf8" fill-opacity="0.12"/>

  <!-- RC letters in core -->
  <text
    x="100" y="105"
    text-anchor="middle"
    font-family="monospace"
    font-weight="700"
    font-size="13"
    fill="#38bdf8"
    filter="url(#glow)"
    letter-spacing="0"
  >RC</text>

  <!-- Pulse ring animation hint (static glow) -->
  <circle cx="100" cy="100" r="20" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.06"/>
  <circle cx="100" cy="100" r="20" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.1"/>
</svg>
